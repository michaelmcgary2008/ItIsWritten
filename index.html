<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="themeColor" content="#0d1117">
<title>It Is Written</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2036%2036'%20fill='none'%3E%3Cline%20x1='18'%20y1='2'%20x2='18'%20y2='28'%20stroke='%234a90d9'%20stroke-width='2'%20stroke-linecap='round'/%3E%3Cline%20x1='11'%20y1='22'%20x2='25'%20y2='22'%20stroke='%234a90d9'%20stroke-width='2'%20stroke-linecap='round'/%3E%3Cpolygon%20points='18,28%2015.5,33%2018,31.5%2020.5,33'%20fill='%234a90d9'/%3E%3C/svg%3E">
<script>
let saved = null; try { saved = localStorage.getItem('iiw-theme'); } catch (e) {} try { const t = saved === 'light' || saved === 'dark' ? saved : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:          #0d1117;
    --surface:     #161b22;
    --surface2:    #1c2333;
    --border:      rgba(100,140,200,0.16);
    --border-s:    rgba(100,160,220,0.38);
    --blue:        #4a90d9;
    --blue-dim:    #2a5a8a;
    --silver:      #c8d8e8;
    --silver-dim:  #7a9ab8;
    --text:        #dce8f0;
    --text-mid:    #8a9bb5;
    --text-dim:    #8090aa;
    --accent-glow: rgba(74,144,217,0.12);
    --warn-bg:     #161d28;
    --warn-border: rgba(74,144,217,0.2);
    --header-bg:   #0d1117;
    --chip-bg:     #1c2333;
    --btn-bg:      #2f6fb8;
    --ok:          #4caf82;
    --err:         #e46a6a;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg:          #f5f2ed;
    --surface:     #fdfaf7;
    --surface2:    #eeeae4;
    --border:      #dbd5cc;
    --border-s:    #a8a094;
    --blue:        #1e5fa8;
    --blue-dim:    #174d8c;
    --silver:      #1c3a58;
    --silver-dim:  #4a6a8a;
    --text:        #1a1814;
    --text-mid:    #5a5248;
    --text-dim:    #6b6459;
    --accent-glow: rgba(30,95,168,0.08);
    --warn-bg:     #eeeae4;
    --warn-border: #c8c0b4;
    --header-bg:   #eeeae4;
    --chip-bg:     #eeeae4;
    --btn-bg:      #1e5fa8;
    --ok:          #1b7448;
    --err:         #b23a3a;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  button, input { -webkit-tap-highlight-color: transparent; }
  button, a, input { touch-action: manipulation; }

  /* Hover styles only on devices that really hover. Kept ahead of the rules that
     must win over hover (.open, .mic-on, [aria-busy]) so the cascade is unchanged. */
  @media (hover: hover) {
    .theme-btn:hover { border-color: var(--border-s); color: var(--text-mid); }
    .search-btn:hover { background: var(--blue-dim); }
    .topic-tag:hover { border-color: var(--border-s); color: var(--text); }
    .retry-btn:hover { border-color: var(--border-s); }
    .more-btn:hover { border-color: var(--border-s); color: var(--text); }
    .more-btn[aria-busy="true"]:hover { border-color: var(--border); }
    .toggle-btn:hover { border-color: var(--border-s); color: var(--text-mid); }
    .mem-mic-btn:hover { border-color: var(--border-s); color: var(--text-mid); }
    .mem-restart:hover { border-color: var(--border-s); }
  }
  @media (hover: none) {
    .toggle-btn:active, .topic-tag:active, .more-btn:active, .retry-btn:active, .theme-btn:active { border-color: var(--border-s); }
  }

  /* Keyboard focus */
  button:focus-visible, .skip-link:focus { outline: 2px solid var(--blue); outline-offset: 2px; }
  main:focus { outline: none; }   /* focus target of the skip link, not a control */
  .results-heading:focus { outline: none; }   /* focus is moved here after a search; it is not a control */

  /* Skip link: off-screen until focused */
  .skip-link {
    position: absolute;
    left: -9999px;
    top: 0;
    z-index: 10;
    padding: 8px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 12px;
  }
  .skip-link:focus { left: 8px; top: 8px; }

  /* Visually hidden, still read by screen readers */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    transition: background 0.2s, color 0.2s;
  }
  body {
    display: flex;
    flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* ── Header ── */
  header {
    background: var(--header-bg);
    border-bottom: 1px solid var(--border);
    padding: 28px 20px 22px;
    text-align: center;
    position: relative;
  }
  .header-row {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    position: relative;
    margin-bottom: 14px;
  }
  .theme-btn {
    position: absolute;
    right: 0;
    top: 0;
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 11px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 400;
    color: var(--text-dim);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }

  .emblem {
    width: 36px; height: 36px;
    margin: 0 auto 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .emblem svg { width: 36px; height: 36px; }

  h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(20px, 5.5vw, 27px);
    font-weight: 600;
    color: var(--silver);
    letter-spacing: 0.1em;
    line-height: 1.1;
  }
  .tagline {
    font-family: 'EB Garamond', serif;
    font-size: 14px;
    font-style: italic;
    color: var(--text-dim);
    margin-top: 6px;
  }

  /* ── Search ── */
  .search-wrap {
    padding: 20px 20px 0;
    max-width: 560px;
    margin: 0 auto;
    width: 100%;
  }
  .search-row {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }
  .search-field {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    transition: border-color 0.15s;
    min-width: 0;
  }
  .search-field:focus-within { border-color: var(--border-s); outline: 2px solid var(--blue); outline-offset: 2px; }
  input[type="text"] {
    flex: 1;
    padding: 13px 14px;
    font-family: 'EB Garamond', serif;
    font-size: 17px;
    color: var(--text);
    background: transparent;
    border: none;
    outline: none;
    min-width: 0;
  }
  input::placeholder { color: var(--text-dim); }
  .search-btn {
    padding: 0 20px;
    background: var(--btn-bg);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
    white-space: nowrap;
  }
  .search-btn[aria-busy="true"] { opacity: 0.4; cursor: default; }

  /* ── Topics ── */
  .topics-wrap {
    padding: 14px 20px 0;
    max-width: 560px;
    margin: 0 auto;
    width: 100%;
  }
  .topics-label {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .topics { display: flex; flex-wrap: wrap; gap: 6px; }
  .topic-tag {
    padding: 4px 12px;
    background: var(--chip-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: 'EB Garamond', serif;
    font-size: 15px;
    color: var(--text-mid);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }

  /* ── Results ── */
  .results-wrap {
    flex: 1;
    padding: 22px 20px 36px;
    max-width: 560px;
    margin: 0 auto;
    width: 100%;
  }
  .results-heading {
    font-family: 'EB Garamond', serif;
    font-size: 14px;
    font-style: italic;
    color: var(--text-dim);
    margin: 0 0 18px;
    font-weight: normal;
  }

  /* Loading */
  .loading {
    padding: 52px 0;
    text-align: center;
    font-family: 'EB Garamond', serif;
    font-size: 16px;
    font-style: italic;
    color: var(--text-dim);
  }

  /* Empty */
  .empty-state { padding: 40px 0; }
  .empty-state p {
    font-family: 'EB Garamond', serif;
    font-size: 20px;
    color: var(--text-dim);
    line-height: 1.65;
    max-width: 300px;
  }
  .empty-state cite {
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-style: normal;
    color: var(--text-dim);
    margin-top: 8px;
  }

  /* Error */
  .error-msg { padding: 32px 0; font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text-mid); }
  .retry-btn {
    margin-top: 10px;
    display: inline-block;
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--text-mid);
    cursor: pointer;
  }
  .more-wrap { text-align: center; margin-top: 18px; }
  .more-btn {
    display: inline-block;
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 9px 18px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--text-mid);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }

  /* ── Verse cards ── */
  .verse-list { display: flex; flex-direction: column; gap: 12px; }
  .verse-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--blue);
    border-radius: 0 8px 8px 0;
    padding: 20px 20px 16px;
    opacity: 0;
    transform: translateY(8px);
    animation: rise 0.3s ease forwards;
  }
  .verse-card:nth-child(1) { animation-delay: 0.04s; }
  .verse-card:nth-child(2) { animation-delay: 0.10s; }
  .verse-card:nth-child(3) { animation-delay: 0.16s; }
  .verse-card:nth-child(4) { animation-delay: 0.22s; }
  .verse-card:nth-child(5) { animation-delay: 0.28s; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .verse-ref {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 11px;
  }
  .verse-ref-text {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--blue);
    min-width: 0;
  }
  .verse-translation {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    color: var(--text-dim);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 2px 7px;
  }
  .verse-text {
    font-family: 'EB Garamond', serif;
    font-size: 19px;
    font-weight: 400;
    line-height: 1.7;
    color: var(--text);
  }
  .verse-note {
    margin-top: 11px;
    padding-top: 11px;
    border-top: 1px solid var(--border);
    font-family: 'EB Garamond', serif;
    font-size: 15px;
    color: var(--text-mid);
    line-height: 1.6;
  }

  /* Toggle buttons */
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .toggle-btn {
    flex: 1;
    padding: 8px 10px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 400;
    color: var(--text-dim);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
    text-align: center;
  }
  .toggle-btn.open { border-color: var(--border-s); color: var(--text-mid); }
  .toggle-btn[aria-busy="true"], .more-btn[aria-busy="true"] { cursor: default; color: var(--text-dim); }
  .toggle-btn[aria-busy="true"] { opacity: 0.35; }
  .more-btn[aria-busy="true"] { border-color: var(--border); }

  /* Context block */
  .context-block {
    margin-top: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .ctx-section {
    padding: 13px 15px;
    border-bottom: 1px solid var(--border);
  }
  .ctx-section:last-child { border-bottom: none; }
  .ctx-label {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.04em;
    margin-bottom: 5px;
  }
  .ctx-text {
    font-family: 'EB Garamond', serif;
    font-size: 16px;
    line-height: 1.65;
    color: var(--text-mid);
  }
  .ctx-section.caution {
    background: var(--warn-bg);
  }
  .ctx-section.caution .ctx-label { color: var(--blue); }
  .ctx-section.caution .ctx-text { color: var(--text); }

  /* Prayer block */
  .prayer-block {
    margin-top: 10px;
    padding: 16px 16px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    scroll-margin: 16px;
  }
  .prayer-label {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.04em;
    margin-bottom: 10px;
  }
  .prayer-text {
    font-family: 'EB Garamond', serif;
    font-size: 18px;
    line-height: 1.75;
    color: var(--text);
    white-space: pre-line;
  }
  .prayer-loading {
    font-family: 'EB Garamond', serif;
    font-size: 15px;
    font-style: italic;
    color: var(--text-dim);
  }
  @keyframes prayer-glow {
    0%   { border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 30%, transparent); }
    100% { border-color: var(--border); box-shadow: 0 0 0 0 color-mix(in srgb, var(--blue) 0%, transparent); }
  }
  .prayer-block.is-new { animation: prayer-glow 2s ease-out 0.3s both; }
  @media (prefers-reduced-motion: reduce) {
    .prayer-block.is-new { animation: none; }
    .verse-card { opacity: 1; transform: none; animation: none; }
    html .mem-mic-btn.mic-on .mic-dot { animation: none; }   /* html prefix: the base .mic-on rule is defined later in the file */
    *, *::before, *::after { transition: none !important; }
  }

  /* ── Memorize block ── */
  .mem-block {
    margin-top: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .mem-header {
    padding: 11px 15px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface2);
  }
  .mem-header-label {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }
  .mem-header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .mem-mic-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 3px 9px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    color: var(--text-dim);
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .mem-mic-btn.mic-on {
    border-color: var(--err);
    color: var(--err);
    background: rgba(208,80,80,0.08);
  }
  .mem-mic-btn.mic-on .mic-dot {
    animation: mic-pulse 1s ease-in-out infinite;
  }
  .mic-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }
  @keyframes mic-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .mem-blank.listening {
    border-bottom-color: var(--err);
    background: rgba(208,80,80,0.06);
  }
  .mem-rounds {
    display: flex;
    gap: 4px;
  }
  .mem-round-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    border: 1px solid var(--border-s);
    background: transparent;
    transition: background 0.2s;
  }
  .mem-round-dot.done { background: var(--blue); border-color: var(--blue); }
  .mem-round-dot.active { background: transparent; border-color: var(--blue); }

  .mem-verse {
    padding: 16px 15px 14px;
    font-family: 'EB Garamond', serif;
    font-size: 19px;
    line-height: 2;
    color: var(--text);
  }
  .mem-blank {
    display: inline-block;
    border: none;
    border-bottom: 1.5px solid var(--border-s);
    background: transparent;
    font-family: 'EB Garamond', serif;
    font-size: 19px;
    color: var(--text);
    outline: none;
    padding: 0 2px;
    vertical-align: baseline;
    min-width: 24px;
    transition: border-color 0.15s;
  }
  .mem-blank:focus { border-color: var(--blue); }
  .mem-blank:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .mem-blank.correct { border-color: var(--ok); color: var(--ok); }
  .mem-blank.wrong   { border-color: var(--err); color: var(--err); }

  .mem-footer {
    padding: 10px 15px 13px;
    border-top: 1px solid var(--border);
    min-height: 38px;
  }
  .mem-feedback {
    font-family: 'EB Garamond', serif;
    font-size: 15px;
    font-style: italic;
    color: var(--text-mid);
    flex: 1;
  }
  .mem-feedback.good { color: var(--ok); }
  .mem-feedback.bad  { color: var(--err); }

  .mem-complete {
    padding: 20px 15px;
    text-align: center;
  }
  .mem-complete p {
    font-family: 'EB Garamond', serif;
    font-size: 17px;
    color: var(--text-mid);
    line-height: 1.6;
  }
  .mem-complete strong {
    color: var(--text);
    font-weight: 500;
  }
  .mem-restart {
    margin-top: 12px;
    padding: 7px 16px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--text-mid);
    cursor: pointer;
    transition: border-color 0.15s;
  }

  /* Footer */
  footer {
    padding: 0 20px 28px;
    max-width: 560px;
    margin: 0 auto;
    width: 100%;
  }
  footer p {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.6;
  }

  /* ── Touch targets (phones and tablets) ── */
  @media (pointer: coarse) {
    .topic-tag, .toggle-btn, .more-btn, .retry-btn, .theme-btn { min-height: 44px; }
    .search-btn { min-height: 48px; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="status" class="sr-only" role="status" aria-live="polite"></div>

<header>
  <div class="header-row">
    <button class="theme-btn" id="themeBtn" aria-label="Switch to light theme">Light</button>
  </div>

  <div class="emblem">
    <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <line x1="18" y1="2" x2="18" y2="28" stroke="#4a90d9" stroke-width="2" stroke-linecap="round"/>
      <line x1="11" y1="22" x2="25" y2="22" stroke="#4a90d9" stroke-width="2" stroke-linecap="round"/>
      <polygon points="18,28 15.5,33 18,31.5 20.5,33" fill="#4a90d9"/>
    </svg>
  </div>

  <h1 translate="no">It Is Written</h1>
  <p class="tagline">The sword of the Spirit — Ephesians 6:17</p>
</header>

<main id="main" tabindex="-1">

<div class="search-wrap">
  <div class="search-row">
    <div class="search-field">
      <input type="text" id="searchInput" aria-label="Search a topic" name="q" inputmode="search" enterkeyhint="search" placeholder="Search a topic — fear, hope, healing…" autocomplete="off" maxlength="80" />
    </div>
    <button class="search-btn" id="searchBtn">Search</button>
  </div>
</div>

<div class="topics-wrap">
  <p class="topics-label">Common topics</p>
  <div class="topics" id="topics"></div>
</div>

<div class="results-wrap" id="resultsWrap">
  <div class="empty-state">
    <p>Your word is a lamp to my feet and a light to my path.</p>
    <cite>Psalm 119:105</cite>
  </div>
</div>

</main>

<footer>
  <p>Scripture quotations are from the ESV® Bible, © 2001 by Crossway. Always read in full context of Scripture.</p>
</footer>

<script>
const TOPICS = [
  'Fear','Anxiety','Hope','Forgiveness','Strength','Love',
  'Faith','Healing','Temptation','Purpose','Peace','Grief',
  'Courage','Wisdom','Identity','Prayer'
];
const MAX_VERSES = 25;   // most verses shown for one search ("More verses" stops here)
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// Polite screen-reader announcement (clear first so repeated text is read again).
function announce(text) {
  const el = document.getElementById('status');
  if (!el) return;
  el.textContent = '';
  setTimeout(() => { el.textContent = text; }, 30);
}

const topicsEl   = document.getElementById('topics');
const searchInput= document.getElementById('searchInput');
const searchBtn  = document.getElementById('searchBtn');
const resultsWrap= document.getElementById('resultsWrap');
const themeBtn   = document.getElementById('themeBtn');
const themeColorMeta = document.getElementById('themeColor');
const EMPTY_STATE_HTML = resultsWrap.innerHTML;   // captured at load; restored when history goes back to no search

// The theme is chosen before first paint by the small inline script in the document head (saved choice, else the device setting).
function syncThemeUi() {
  const dark = document.documentElement.getAttribute('data-theme') !== 'light';
  themeBtn.textContent = dark ? 'Light' : 'Dark';
  themeBtn.setAttribute('aria-label', `Switch to ${dark ? 'light' : 'dark'} theme`);
  if (themeColorMeta) themeColorMeta.setAttribute('content', dark ? '#0d1117' : '#f5f2ed');
}
syncThemeUi();
themeBtn.onclick = () => {
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  syncThemeUi();
  try { localStorage.setItem('iiw-theme', next); } catch (e) {}
};

TOPICS.forEach(t => {
  const tag = document.createElement('button');
  tag.className = 'topic-tag';
  tag.textContent = t;
  tag.onclick = () => { searchInput.value = t; doSearch(t); };
  topicsEl.appendChild(tag);
});

// Only the button's own click is ignored while a search is running; Enter or a topic chip still replaces the running search.
searchBtn.onclick = () => { if (searchBtn.getAttribute('aria-busy') === 'true') return; const q = searchInput.value.trim(); if (q) doSearch(q); };
searchInput.addEventListener('keydown', e => { if (e.isComposing || e.keyCode === 229) return; if (e.key === 'Enter') { const q = searchInput.value.trim(); if (q) doSearch(q); }});

// Skip link: focus <main> directly. Following "#main" would add a history entry and fire popstate.
document.querySelector('.skip-link').addEventListener('click', e => { e.preventDefault(); document.getElementById('main').focus(); });

async function askClaude(payload, signal) {
  const res = await fetch('/api/claude', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
    signal
  });
  let data = null;
  try { data = await res.json(); } catch (e) { if (e && e.name === 'AbortError') throw e; }
  if (!res.ok || !data || typeof data.text !== 'string') {
    throw new Error((data && data.error) || `Request failed (${res.status})`);
  }
  return data;
}

let currentAbort = null;
let verseStore = {};   // index -> verse; each has contextStatus: 'loading' | 'ready' | 'error'
let currentTopic = '';
let lastQuery = '';    // last submitted search, re-run by "Try again"
let shownQuery = '';   // the query the page is currently showing (or loading); '' = the empty state

// Focus is only moved for the reader when they haven't gone elsewhere meanwhile (say, started typing a new query).
// `extra` lets a caller allow more elements.
function focusIsFree(extra) {
  const a = document.activeElement;
  return !a || a === document.body || a === document.documentElement || resultsWrap.contains(a) || !!(extra && extra(a));
}

async function doSearch(topic, { fromHistory = false } = {}) {
  if (!topic || !topic.trim()) return;
  lastQuery = topic;
  shownQuery = topic.trim().slice(0, 80);   // same normalisation as qFromUrl()
  // A search the user starts adds a history entry (unless the URL already says so); searches run from the URL or from popstate never do.
  if (!fromHistory && qFromUrl() !== topic) {
    try { history.pushState({ q: topic }, '', '?q=' + encodeURIComponent(topic)); } catch (e) {}
  }
  if (currentAbort) currentAbort.abort();
  currentAbort = new AbortController();
  const mySignal = currentAbort.signal;
  resultsWrap.innerHTML = `<div class="loading">Searching the Word…</div>`;
  announce('Searching the Word…');
  searchBtn.setAttribute('aria-busy', 'true');

  try {
    const result = await askClaude({ action: 'search', topic }, mySignal);
    const raw = result.text.replace(/```json|```/gi,'').trim();
    const scriptures = JSON.parse(raw);
    const indexes = showResults(topic, scriptures);
    if (indexes) {
      announce(`${indexes.length} ${verseWord(indexes.length)} on ${topic}`);
      // The input case covers Enter in the box: it still holds exactly what was submitted.
      if (focusIsFree(a => a === searchBtn || topicsEl.contains(a) || (a === searchInput && searchInput.value.trim() === topic.trim()))) {
        document.getElementById('resultsHeading')?.focus({ preventScroll: true });
      }
      loadContext(indexes, mySignal);
    }
  } catch(err) {
    if (err && err.name === 'AbortError') return;
    console.error(err);
    showError('Something went wrong. Please try again.');
  } finally {
    // An aborted search must not clear the busy state of the search that replaced it.
    if (currentAbort && currentAbort.signal === mySignal) searchBtn.removeAttribute('aria-busy');
  }
}

function showError(msg) {
  resultsWrap.innerHTML = `<div class="error-msg" role="alert"><p>${esc(msg)}</p><button class="retry-btn" onclick="doSearch(lastQuery)">Try again</button></div>`;   // role="alert" announces it
}

function verseWord(n) { return n === 1 ? 'verse' : 'verses'; }

function cardHtml(s, i) {
  const ref = String(s.ref || '');
  const refShown = esc(ref.replace(/^(\d)\s/, '$1\u00a0'));   // keep "1 John" together on one line (display only)
  return `
    <article class="verse-card" id="card-${i}" aria-labelledby="ref-${i}">
      <div class="verse-ref">
        <span class="verse-ref-text" id="ref-${i}">${refShown}</span>
        <span class="verse-translation">${esc(s.translation||'')}</span>
      </div>
      <div class="verse-text">${esc(s.verse||'')}</div>
      ${s.note ? `<div class="verse-note">${esc(s.note)}</div>` : ''}
      <div class="btn-row">
        <button class="toggle-btn" id="ctx-btn-${i}" onclick="toggleContext(${i})" aria-expanded="false" aria-controls="context-${i}" aria-describedby="ref-${i}">Context &amp; insight</button>
        <button class="toggle-btn" id="pray-btn-${i}" onclick="generatePrayer(${i})" aria-expanded="false" aria-controls="prayer-${i}" aria-describedby="ref-${i}">Pray this</button>
        <button class="toggle-btn" id="mem-btn-${i}" onclick="toggleMemorize(${i})" aria-expanded="false" aria-controls="memorize-${i}" aria-describedby="ref-${i}">Memorize</button>
      </div>
      <div id="context-${i}" style="display:none;"></div>
      <div id="prayer-${i}"></div>
      <div id="memorize-${i}" style="display:none;"></div>
    </article>`;
}

// Appends scriptures to verseStore at the next free indexes; returns those indexes.
function addVerses(scriptures) {
  const start = Object.keys(verseStore).length;
  return scriptures.map((s, n) => {
    const i = start + n;
    verseStore[i] = { ref: s.ref||'', verse: s.verse||'', topic: currentTopic, audience: s.audience||'', caution: s.caution||null, application: s.application||'', contextStatus: 'loading' };
    return i;
  });
}

function updateHeading() {
  const el = document.querySelector('.results-heading');
  const n = Object.keys(verseStore).length;
  if (el) el.innerHTML = `${n} ${verseWord(n)} on ${esc(currentTopic)}`;
}

function moreButtonHtml() {
  if (Object.keys(verseStore).length >= MAX_VERSES) return '';
  return `<div class="more-wrap"><button class="more-btn" id="moreBtn" onclick="loadMore()" aria-controls="verseList">More verses</button></div>`;
}

function showResults(topic, scriptures) {
  verseStore = {};
  if (!Array.isArray(scriptures) || scriptures.length === 0) { showError('No verses found. Try a different topic.'); return; }
  currentTopic = topic;
  const indexes = addVerses(scriptures);

  const n = Object.keys(verseStore).length;
  const heading = `<h2 class="results-heading" id="resultsHeading" tabindex="-1">${n} ${verseWord(n)} on ${esc(topic)}</h2>`;
  const cards = scriptures.map((s, i) => cardHtml(s, i)).join('');

  resultsWrap.innerHTML = heading + `<div class="verse-list" id="verseList">${cards}</div>` + moreButtonHtml();
  return indexes;
}

async function loadMore() {
  const btn = document.getElementById('moreBtn');
  if (!btn || !currentTopic) return;
  if (btn.getAttribute('aria-busy') === 'true') return;
  btn.setAttribute('aria-busy', 'true');
  btn.textContent = 'Searching the Word…';
  announce('Loading more verses…');
  const signal = currentAbort ? currentAbort.signal : undefined;
  try {
    const exclude = Object.values(verseStore).map(v => v.ref).filter(Boolean).slice(-30);
    const result = await askClaude({ action: 'search', topic: currentTopic, exclude }, signal);
    const raw = result.text.replace(/```json|```/gi,'').trim();
    const scriptures = JSON.parse(raw);
    const seen = new Set(Object.values(verseStore).map(v => String(v.ref).toLowerCase()));
    const fresh = (Array.isArray(scriptures) ? scriptures : []).filter(s => s && s.ref && !seen.has(String(s.ref).toLowerCase()))
      .slice(0, Math.max(0, Math.min(5, MAX_VERSES - Object.keys(verseStore).length)));
    // Nothing new: the button stays inert (aria-busy left on), as it used to stay disabled.
    if (!fresh.length) { btn.textContent = 'No more verses found.'; announce('No more verses found.'); return; }
    const mayFocus = focusIsFree();
    const indexes = addVerses(fresh);
    document.getElementById('verseList').insertAdjacentHTML('beforeend', indexes.map((i, n) => cardHtml(fresh[n], i)).join(''));
    updateHeading();
    announce(`${indexes.length} more ${verseWord(indexes.length)} added`);
    if (Object.keys(verseStore).length >= MAX_VERSES) {
      btn.parentElement.remove();
    } else {
      btn.removeAttribute('aria-busy');
      btn.textContent = 'More verses';
    }
    const firstNew = document.getElementById(`ctx-btn-${indexes[0]}`);
    if (firstNew && mayFocus) firstNew.focus({ preventScroll: true });
    loadContext(indexes, signal);
  } catch (err) {
    if (err && err.name === 'AbortError') return;
    console.error(err);
    btn.removeAttribute('aria-busy');
    btn.textContent = 'Couldn’t load more. Try again';
    announce('Couldn’t load more. Try again');
  }
}

async function loadContext(indexes, signal) {
  if (!indexes.length) return;
  indexes.forEach(i => { verseStore[i].contextStatus = 'loading'; });
  try {
    const verses = indexes.map(i => ({ ref: verseStore[i].ref, verse: verseStore[i].verse }));
    const result = await askClaude({ action: 'context', topic: currentTopic, verses }, signal);
    const raw = result.text.replace(/```json|```/gi,'').trim();
    const items = JSON.parse(raw);
    if (!Array.isArray(items) || items.length === 0) throw new Error('Unexpected context response');
    indexes.forEach((i, n) => {
      const c = items[n] || {};
      verseStore[i].audience = c.audience || '';
      verseStore[i].caution = c.caution || null;
      verseStore[i].application = c.application || '';
      verseStore[i].contextStatus = 'ready';
    });
    announce('Context ready');
  } catch (err) {
    if (err && err.name === 'AbortError') return;
    console.error(err);
    indexes.forEach(i => { verseStore[i].contextStatus = 'error'; });
  }
  indexes.forEach(i => {
    const div = document.getElementById(`context-${i}`);
    if (div && div.style.display !== 'none') renderContext(i);
  });
}

function renderContext(index) {
  const div = document.getElementById(`context-${index}`);
  const data = verseStore[index];
  if (!div || !data) return;

  if (data.contextStatus === 'ready') {
    const cautionHtml = data.caution ? `
    <div class="ctx-section caution">
      <div class="ctx-label">Common misreading</div>
      <div class="ctx-text">${esc(data.caution)}</div>
    </div>` : '';

    div.innerHTML = `
    <div class="context-block">
      <div class="ctx-section">
        <div class="ctx-label">Original audience</div>
        <div class="ctx-text">${esc(data.audience)}</div>
      </div>
      ${cautionHtml}
      <div class="ctx-section">
        <div class="ctx-label">Faithful application</div>
        <div class="ctx-text">${esc(data.application)}</div>
      </div>
    </div>`;
  } else {
    div.innerHTML = `<div class="context-block"><div class="ctx-section"><div class="ctx-text">${data.contextStatus === 'error' ? 'Context unavailable right now.' : 'Gathering context…'}</div></div></div>`;
  }
}

function toggleContext(index) {
  const div = document.getElementById(`context-${index}`);
  const btn = document.getElementById(`ctx-btn-${index}`);
  const data = verseStore[index];
  if (!div || !data) return;

  if (div.style.display !== 'none') {
    div.style.display = 'none';
    btn.classList.remove('open');
    btn.textContent = 'Context & insight';
    btn.setAttribute('aria-expanded', 'false');
    return;
  }

  if (data.contextStatus === 'error') loadContext([index], currentAbort ? currentAbort.signal : undefined);
  renderContext(index);
  div.style.display = 'block';
  btn.classList.add('open');
  btn.textContent = 'Hide context';
  btn.setAttribute('aria-expanded', 'true');
}

async function generatePrayer(index) {
  const btn = document.getElementById(`pray-btn-${index}`);
  const prayerDiv = document.getElementById(`prayer-${index}`);
  const data = verseStore[index];
  if (!btn || !prayerDiv || !data) return;
  if (btn.getAttribute('aria-busy') === 'true') return;

  if (prayerDiv.innerHTML && !prayerDiv.dataset.error) {
    prayerDiv.innerHTML = '';
    btn.classList.remove('open');
    btn.textContent = 'Pray this';
    btn.setAttribute('aria-expanded', 'false');
    return;
  }
  delete prayerDiv.dataset.error;   // a failed attempt is retried from scratch

  const startY = window.scrollY;
  btn.setAttribute('aria-busy', 'true');
  btn.textContent = 'Writing…';
  prayerDiv.innerHTML = `<div class="prayer-block"><div class="prayer-loading">Lifting this Word in prayer…</div></div>`;
  announce('Writing a prayer…');

  try {
    const result = await askClaude({ action: 'prayer', ref: data.ref, verse: data.verse, topic: data.topic });
    prayerDiv.innerHTML = `
      <div class="prayer-block is-new">
        <div class="prayer-label">A prayer</div>
        <div class="prayer-text">${esc(result.text.trim())}</div>
      </div>`;
    btn.removeAttribute('aria-busy');
    btn.classList.add('open');
    btn.textContent = 'Hide prayer';
    btn.setAttribute('aria-expanded', 'true');
    if (btn.isConnected) announce('Prayer ready for ' + data.ref);
    const block = prayerDiv.querySelector('.prayer-block');
    if (block) {
      block.addEventListener('animationend', () => block.classList.remove('is-new'), { once: true });
      // Scroll only if the reader hasn't moved and the prayer isn't already fully on screen.
      const r = block.getBoundingClientRect();
      const stayedPut = Math.abs(window.scrollY - startY) < 4;
      const fullyVisible = r.top >= 0 && r.bottom <= window.innerHeight;
      if (stayedPut && !fullyVisible) block.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'nearest' });
    }
  } catch(err) {
    console.error(err);
    btn.removeAttribute('aria-busy');
    prayerDiv.innerHTML = `<div class="prayer-block" role="alert"><div class="prayer-loading">Couldn’t write a prayer right now. Try again.</div></div>`;
    prayerDiv.dataset.error = '1';
    btn.textContent = 'Pray this';
    btn.setAttribute('aria-expanded', 'false');
  }
}

// ── Memorize ──────────────────────────────────────────────
const MEM_ROUNDS = [0.25, 0.5, 0.75, 1.0];
let memState = {};

// Tiny Web Audio ding — no file needed. One AudioContext is created on first use and reused.
let audioCtx = null;
function playDing() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = audioCtx;
    if (ctx.state === 'suspended') ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1100, ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.18, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.35);
  } catch(e) {}
}

function toggleMemorize(index) {
  const div = document.getElementById(`memorize-${index}`);
  const btn = document.getElementById(`mem-btn-${index}`);
  const data = verseStore[index];
  if (!div || !data) return;

  if (div.style.display !== 'none') {
    stopMic(index);
    div.style.display = 'none';
    btn.classList.remove('open');
    btn.textContent = 'Memorize';
    btn.setAttribute('aria-expanded', 'false');
    delete memState[index];
    return;
  }

  // Nothing to blank out (empty or punctuation-only verse): leave everything as it is.
  if (chooseBlankIndices(tokenize(data.verse), MEM_ROUNDS[0]).size === 0) return;

  memState[index] = { round: 0 };
  renderMemRound(index);
  div.style.display = 'block';
  btn.classList.add('open');
  btn.textContent = 'Close';
  btn.setAttribute('aria-expanded', 'true');
}

// A word reduced to what has to be typed: lower case, curly quotes straightened, punctuation dropped.
function normWord(s) { return String(s).toLowerCase().replace(/[’‘]/g, "'").replace(/[“”]/g, '"').replace(/[^\p{L}\p{N}']/gu, ''); }

// Typed text solves a blank when it normalises to the word, with or without apostrophes ("LORD’s" takes "lord's" or "lords").
function matchesAnswer(typed, answer) {
  const given = normWord(typed);
  return given !== '' && (given === answer || given === answer.replace(/'/g, ''));
}

function tokenize(verse) {
  const tokens = [];
  const re = /(\s*)(\S+)/g;
  let m;
  while ((m = re.exec(verse)) !== null) {
    // key is empty for punctuation-only tokens (a spaced dash, an ellipsis, a lone apostrophe): those are never blanked
    tokens.push({ raw: m[2], key: normWord(m[2]).replace(/^'+$/, ''), space: m[1] });
  }
  return tokens;
}

function chooseBlankIndices(tokens, fraction) {
  const isRound4 = fraction >= 1.0;
  const eligible = tokens
    .map((t, i) => ({ i, len: t.key.length }))
    .filter(t => t.len > 0 && (isRound4 || t.len > 2));
  if (!eligible.length) return new Set();
  if (isRound4) return new Set(eligible.map(t => t.i));
  const count = Math.max(1, Math.round(eligible.length * fraction));
  const step = eligible.length / count;
  const chosen = new Set();
  for (let k = 0; k < count; k++) {
    chosen.add(eligible[Math.min(eligible.length - 1, Math.round(k * step + step / 2))].i);
  }
  return chosen;
}

function renderMemRound(index) {
  const div = document.getElementById(`memorize-${index}`);
  const data = verseStore[index];
  const state = memState[index];
  if (!div || !data || !state) return;

  const fraction = MEM_ROUNDS[state.round];
  const tokens = tokenize(data.verse);
  state.tokens = tokens;
  state.blanks = chooseBlankIndices(tokens, fraction);
  state.solved = new Set();

  const dots = MEM_ROUNDS.map((_, ri) => {
    const cls = ri < state.round ? 'mem-round-dot done' : ri === state.round ? 'mem-round-dot active' : 'mem-round-dot';
    return `<div class="${cls}"></div>`;
  }).join('');

  let verseHtml = '';
  const blankList = []; // ordered list of token indices that are blanked
  tokens.forEach((t, i) => {
    const spaceHtml = t.space ? ' ' : '';   // ordinary space so the verse can wrap
    if (state.blanks.has(i)) {
      blankList.push(i);
      const w = Math.max(40, t.raw.length * 11);
      verseHtml += spaceHtml + `<input class="mem-blank" id="mb-${index}-${i}" aria-label="Blank ${blankList.length} of ${state.blanks.size}" data-answer="${esc(t.key)}" data-display="${esc(t.raw)}" data-tidx="${i}" style="width:${w}px" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />`;
    } else {
      verseHtml += spaceHtml + t.raw.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  });
  state.blankList = blankList;

  const roundLabel = state.round < 3
    ? `Round ${state.round + 1} of 4 — type each missing word`
    : `Final round — write the whole verse from memory`;

  // Voice input is disabled for now: the Speak button never renders. Restore the
  // SpeechRecognition check here to bring it back.
  const micSupported = false;
  const micBtnHtml = micSupported
    ? `<button class="mem-mic-btn" id="mem-mic-${index}" onclick="toggleMic(${index})" title="Speak the words"><span class="mic-dot"></span>Speak</button>`
    : '';

  div.innerHTML = `
    <div class="mem-block">
      <div class="mem-header">
        <span class="mem-header-label">${roundLabel}</span>
        <div class="mem-header-right">
          ${micBtnHtml}
          <div class="mem-rounds">${dots}</div>
        </div>
      </div>
      <div class="mem-verse">${verseHtml}</div>
      <div class="mem-footer">
        <span class="mem-feedback" id="mem-fb-${index}"></span>
      </div>
    </div>`;

  // Wire up real-time listeners
  div.querySelectorAll('.mem-blank').forEach(inp => {
    inp.addEventListener('input', () => handleBlankInput(inp, index));
  });

  announce(roundLabel);

  // Focus first blank
  const first = div.querySelector('.mem-blank');
  if (first && window.matchMedia('(pointer: fine)').matches) setTimeout(() => first.focus(), 80);   // not on touch: it would pop the keyboard open
}

function handleBlankInput(inp, index) {
  const state = memState[index];
  if (!state) return;
  if (inp.classList.contains('correct')) return; // already solved, ignore

  const answer = inp.dataset.answer;

  if (matchesAnswer(inp.value, answer)) {
    // Correct! Restore original capitalisation and punctuation
    inp.value = inp.dataset.display;
    inp.classList.add('correct');
    inp.classList.remove('wrong');
    inp.readOnly = true;
    playDing();

    const tidx = parseInt(inp.dataset.tidx);
    state.solved.add(tidx);

    // Move focus to next unsolved blank
    const nextTidx = state.blankList.find(ti => !state.solved.has(ti) && ti > tidx);
    if (nextTidx !== undefined) {
      const next = document.getElementById(`mb-${index}-${nextTidx}`);
      if (next) setTimeout(() => next.focus(), 40);
    }

    // Check if all solved
    if (state.solved.size === state.blanks.size) {
      roundComplete(index);
    }
  } else {
    inp.classList.remove('correct', 'wrong');
  }
}

function roundComplete(index) {
  const state = memState[index];
  const fb = document.getElementById(`mem-fb-${index}`);
  state.round++;

  if (state.round >= MEM_ROUNDS.length) {
    announce('Well done!');
    const data = verseStore[index];
    const div = document.getElementById(`memorize-${index}`);
    setTimeout(() => {
      div.querySelector('.mem-block').innerHTML = `
        <div class="mem-complete">
          <p>You've committed <strong>${esc(data.ref)}</strong> to memory.</p>
          <p style="margin-top:8px; font-size:15px;">"${esc(data.verse)}"</p>
          <button class="mem-restart" onclick="restartMemorize(${index})">Start over</button>
        </div>`;
      const again = div.querySelector('.mem-restart');
      if (again) again.focus({ preventScroll: true });
    }, 400);
  } else {
    if (fb) { fb.textContent = 'Well done!'; fb.className = 'mem-feedback good'; }
    setTimeout(() => renderMemRound(index), 700);
  }
}

function restartMemorize(index) {
  stopMic(index);
  memState[index] = { round: 0 };
  renderMemRound(index);
}

// ── Speech recognition ────────────────────────────────────
let activeRecognition = null;

function toggleMic(index) {
  const state = memState[index];
  if (!state) return;
  state.micOn ? stopMic(index) : startMic(index);
}

function stopMic(index) {
  if (activeRecognition) {
    activeRecognition._stopped = true;
    try { activeRecognition.stop(); } catch(e) {}
    activeRecognition = null;
  }
  const state = memState[index];
  if (state) state.micOn = false;

  const btn = document.getElementById(`mem-mic-${index}`);
  if (btn) { btn.classList.remove('mic-on'); btn.innerHTML = '<span class="mic-dot"></span>Speak'; }

  const div = document.getElementById(`memorize-${index}`);
  if (div) div.querySelectorAll('.mem-blank').forEach(b => b.classList.remove('listening'));
}

function focusListeningBlank(index) {
  const state = memState[index];
  const div = document.getElementById(`memorize-${index}`);
  if (!state || !div) return;
  div.querySelectorAll('.mem-blank').forEach(b => b.classList.remove('listening'));
  const nextTidx = state.blankList.find(ti => !state.solved.has(ti));
  if (nextTidx === undefined) return null;
  const inp = document.getElementById(`mb-${index}-${nextTidx}`);
  if (inp) { inp.classList.add('listening'); inp.focus(); }
  return nextTidx;
}

function startMic(index) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return;

  if (activeRecognition) {
    activeRecognition._stopped = true;
    try { activeRecognition.stop(); } catch(e) {}
    activeRecognition = null;
  }

  const state = memState[index];
  if (!state) return;
  state.micOn = true;

  const btn = document.getElementById(`mem-mic-${index}`);
  if (btn) { btn.classList.add('mic-on'); btn.innerHTML = '<span class="mic-dot"></span>Listening…'; }

  focusListeningBlank(index);

  const recog = new SpeechRecognition();
  recog._stopped = false;
  activeRecognition = recog;

  recog.lang = 'en-US';
  recog.continuous = true;       // one session stays open the whole round
  recog.interimResults = false;
  recog.maxAlternatives = 6;

  recog.onresult = (event) => {
    if (!state.micOn || recog._stopped) return;

    // Find current target blank
    const nextTidx = state.blankList.find(ti => !state.solved.has(ti));
    if (nextTidx === undefined) { stopMic(index); return; }

    const inp = document.getElementById(`mb-${index}-${nextTidx}`);
    if (!inp || inp.classList.contains('correct')) return;

    // Check all alternatives from the latest result
    const result = event.results[event.results.length - 1];
    for (let a = 0; a < result.length; a++) {
      const words = result[a].transcript.trim().split(/\s+/);
      // Try just the last word spoken in case they said extra words
      const spokenLast = words[words.length - 1];

      if (matchesAnswer(spokenLast, inp.dataset.answer)) {
        inp.value = spokenLast;
        inp.dispatchEvent(new Event('input'));
        // After a short pause highlight the next blank
        setTimeout(() => { if (state.micOn) focusListeningBlank(index); }, 500);
        break;
      }
    }
  };

  recog.onerror = (e) => {
    if (recog._stopped) return;
    if (e.error === 'no-speech') return; // silent — just keep listening
    if (e.error === 'aborted') return;
    // Real errors
    stopMic(index);
    const fb = document.getElementById(`mem-fb-${index}`);
    if (fb) {
      fb.textContent = e.error === 'not-allowed'
        ? 'Microphone permission denied — check your browser settings.'
        : 'Microphone error: ' + e.error;
      fb.className = 'mem-feedback bad';
    }
  };

  recog.onend = () => {
    // Continuous mode can still end if the browser cuts it — restart if still meant to be on
    if (!recog._stopped && state.micOn) {
      try { recog.start(); } catch(e) {}
    }
  };

  try {
    recog.start();
  } catch(e) {
    stopMic(index);
    const fb = document.getElementById(`mem-fb-${index}`);
    if (fb) { fb.textContent = 'Could not start microphone.'; fb.className = 'mem-feedback bad'; }
  }
}
// ── End memorize ──────────────────────────────────────────

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Search state in the URL (?q=…) ────────────────────────
function qFromUrl() {
  return (new URLSearchParams(location.search).get('q') || '').trim().slice(0, 80);   // 80 = the input's maxlength
}

function restoreEmptyState() {
  if (currentAbort) currentAbort.abort();
  resultsWrap.innerHTML = EMPTY_STATE_HTML;
  searchInput.value = '';
  verseStore = {};
  shownQuery = '';
  searchBtn.removeAttribute('aria-busy');
}

window.addEventListener('popstate', e => {
  // Hash-only changes and the like leave the page showing what the URL already says: do nothing.
  if (qFromUrl() === shownQuery) return;
  const q = (e.state && typeof e.state.q === 'string' && e.state.q.trim()) || qFromUrl();
  if (q) { searchInput.value = q; doSearch(q, { fromHistory: true }); }
  else restoreEmptyState();
});

// Opened (or reloaded) with ?q=… : fill the box and run that search.
const initialQuery = qFromUrl();
if (initialQuery) { searchInput.value = initialQuery; doSearch(initialQuery, { fromHistory: true }); }
</script>
</body>
</html>
